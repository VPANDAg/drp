name: 🚀 Windows RDP via Tailscale

on:
  workflow_dispatch:
    inputs:
      tailscale_auth_key:
        description: 'Tailscale auth key (tskey-auth-...)'
        required: true
        type: string

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Windows RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force

          $user = 'runneradmin'
          $pass = 'Password123!'

          if (-not (net user $user 2>$null)) {
            net user $user $pass /add | Out-Null
          }

          net localgroup 'Remote Desktop Users' $user /add 2>$null | Out-Null
          net localgroup 'Administrators' $user /add 2>$null | Out-Null

      - name: Install Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ inputs.tailscale_auth_key }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw 'Tailscale auth key is required.'
          }

          $setupPath = Join-Path $env:TEMP 'tailscale-setup.exe'
          Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' -OutFile $setupPath
          Start-Process -FilePath $setupPath -ArgumentList '/quiet' -Wait -NoNewWindow

          $tailscaleExe = 'C:\Program Files\Tailscale\tailscale.exe'
          if (-not (Test-Path $tailscaleExe)) {
            throw 'Tailscale was not installed successfully.'
          }

          & $tailscaleExe up --authkey="$env:TAILSCALE_AUTH_KEY" --accept-routes --hostname="github-runner-rdp"

          $ip = (& $tailscaleExe ip -4 | Select-Object -First 1)
          "TAILSCALE_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Show connection info
        shell: pwsh
        run: |
          Write-Host ''
          Write-Host '==================================================================' -ForegroundColor Cyan
          Write-Host '✅ Windows RDP is ready' -ForegroundColor Green
          Write-Host '==================================================================' -ForegroundColor Cyan
          Write-Host "Tailscale IP : $env:TAILSCALE_IP" -ForegroundColor Yellow
          Write-Host 'Username     : runneradmin' -ForegroundColor White
          Write-Host 'Password     : Password123!' -ForegroundColor White
          Write-Host '==================================================================' -ForegroundColor Cyan
          Write-Host ''

      - name: Keep runner alive
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(340)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 60
            Write-Host "Runner active: $((Get-Date).ToString('yyyy-MM-dd HH:mm:ss'))"
          }
